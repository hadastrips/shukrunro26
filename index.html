<!DOCTYPE html> 
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טיול זוגי שוקרון ברומא</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brown: #5C4033;
            --blue: #2B5C8F;
            --gold: #C5A059;
            --bg-light: #F7F7F7;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-light);
            color: #333;
            margin: 0 auto;
            max-width: 500px;
            padding: 15px;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            margin-top: 20px;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--blue);
            display: block;
            margin: 0 auto 20px auto;
            object-fit: cover;
        }

        h1 {
            color: var(--brown);
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
        }

        /* Hero Section */
        .hero-message {
            text-align: center;
            padding: 40px 20px;
            background: var(--white);
            border-radius: 15px;
            margin: 30px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid var(--gold);
        }

        .hero-message h2 {
            color: var(--blue);
            font-size: 1.6rem;
            margin: 0 0 10px 0;
        }

        /* Review Section */
        .review-box {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            border-top: 4px solid var(--gold);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .review-box h3 {
            color: var(--brown);
            margin-top: 0;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Assistant', sans-serif;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 10px;
        }

        .send-btn {
            width: 100%;
            background-color: var(--blue);
            color: var(--white);
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .send-btn:hover {
            background-color: var(--brown);
        }

        footer {
            text-align: center;
            padding: 20px 10px;
            border-top: 1px solid #ddd;
        }

        .footer-sig {
            color: var(--brown);
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .footer-warn {
            color: #777;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <header>
        <img src="1.jpg" alt="Logo" class="logo">
        <h1>טיול זוגי שוקרון ברומא</h1>
    </header>

    <main>
        <div class="hero-message">
            <h2>איזה כיף שנהניתם!</h2>
            <p style="font-size: 1.2rem; color: #555;">נתראה בטיול הבא,</p>
            <p style="font-weight: 800; color: var(--blue); font-size: 1.3rem;">הדס</p>
        </div>

        <div class="review-box">
            <h3>נשמח לשמוע איך היה!</h3>
            <textarea id="reviewText" placeholder="כתבו כאן את החוות דעת שלכם על הטיול..."></textarea>
            <button class="send-btn" onclick="sendReview()">שליחה לוואטסאפ של הדס <i class="fab fa-whatsapp"></i></button>
        </div>
    </main>

    <footer>
        <div class="footer-sig">כל הזכויות שמורות להדס טרכטר - יועצת טיולים בארץ ובעולם 050-5685356.</div>
        <div class="footer-warn">אין להעביר ללא אישור מפורש. העובר על כך עובר על גזל לפי דין תורה וחוקי המקום.</div>
    </footer>

    <script>
        function sendReview() {
            const review = document.getElementById('reviewText').value;
            if (review.trim() === "") {
                alert("נא לכתוב חוות דעת לפני השליחה");
                return;
            }
            const phone = "972505685356";
            const message = encodeURIComponent("היי הדס, חזרנו מהטיול ברומא ורציתי לשתף בחוות דעת: " + review);
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }
    </script>

</body>
</html>
